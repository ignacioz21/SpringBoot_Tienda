<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <div class="container">
        <h2>Registro</h2>
        <form th:action="@{/registro}" method="post" th:object="${usuario}">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            
            <div class="form-group">
                <label for="contrsena">Contraseña:</label>
                <input type="password" id="contrsena" th:field="*{contrsena}" required>
            </div>
            
            <button type="submit">Registrarse</button>
        </form>
        
        <p><a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a></p>
    </div>
</body>
</html>
